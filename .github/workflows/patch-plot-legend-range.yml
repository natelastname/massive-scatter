name: Patch plot legend range

on:
  push:
    branches:
      - feature/plot-grammar-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Precompute plot legend range [skip patch]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('viewer/src/main.ts')
          text = path.read_text()
          old = """  const data = responseData(response);\n  const aggregate = response.mode === 'aggregate';\n  renderOrigin = response.origin;\n"""
          new = """  const data = responseData(response);\n  const aggregate = response.mode === 'aggregate';\n  if (manifest.plot?.scatter.color.kind === 'constant') {\n    currentColorRange = null;\n  } else if (manifest.plot) {\n    currentColorRange = encodingRange(manifest.plot.scatter.color, data, aggregate);\n  }\n  renderOrigin = response.origin;\n"""
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Write viewer through GitHub REST API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          path = 'viewer/src/main.ts'
          token, repo, branch = os.environ['GH_TOKEN'], os.environ['REPO'], os.environ['BRANCH']
          headers = {'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'}
          def request(method, url, payload=None):
              req = Request(url, data=None if payload is None else json.dumps(payload).encode(), headers=headers, method=method)
              with urlopen(req) as response: return json.load(response)
          current = request('GET', f'https://api.github.com/repos/{repo}/contents/{quote(path)}?ref={quote(branch)}')
          request('PUT', f'https://api.github.com/repos/{repo}/contents/{quote(path)}', {'message': 'Precompute plot legend range [skip patch]', 'content': base64.b64encode(Path(path).read_bytes()).decode(), 'sha': current['sha'], 'branch': branch})
          PY
