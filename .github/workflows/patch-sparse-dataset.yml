name: Patch sparse dataset reader

on:
  push:
    branches:
      - feature/sparse-lod-20260830

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Dispatch schema v3 to sparse LOD reader [skip patch]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch dataset reader
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/massive_scatter/dataset.py')
          text = path.read_text()
          text = text.replace(
              'from .manifest import LevelManifest, Manifest\nfrom .spec import AggregateRequest',
              'from .manifest import LevelManifest, Manifest\nfrom .sparse_dataset import SparseLodReader\nfrom .spec import AggregateRequest',
          )
          text = text.replace(
              '        self._parts = pq.read_table(self.path / "index.parquet").to_pylist()\n        self._lod = zarr.open_group(self.path / "lod.zarr", mode="r")\n',
              '        self._parts = pq.read_table(self.path / "index.parquet").to_pylist()\n        self._sparse_lod = (\n            SparseLodReader(self.path, self.manifest)\n            if self.manifest.uses_sparse_lod\n            else None\n        )\n        self._lod = (\n            None\n            if self._sparse_lod is not None\n            else zarr.open_group(self.path / "lod.zarr", mode="r")\n        )\n\n    def _legacy_lod(self) -> zarr.Group:\n        if self._lod is None:\n            raise RuntimeError("Legacy Zarr LOD storage is not open.")\n        return self._lod\n',
          )
          text = text.replace('_array(self._lod,', '_array(self._legacy_lod(),')
          target = '''    ) -> dict[str, Any]:\n        level = self._choose_level(\n            min_x=min_x,\n            max_x=max_x,\n            min_y=min_y,\n            max_y=max_y,\n            pixel_width=pixel_width,\n            pixel_height=pixel_height,\n            max_cells=max_cells,\n        )\n'''
          replacement = '''    ) -> dict[str, Any]:\n        if self._sparse_lod is not None:\n            return self._sparse_lod.aggregate_view(\n                min_x=min_x,\n                max_x=max_x,\n                min_y=min_y,\n                max_y=max_y,\n                pixel_width=pixel_width,\n                pixel_height=pixel_height,\n                max_cells=max_cells,\n            )\n        level = self._choose_level(\n            min_x=min_x,\n            max_x=max_x,\n            min_y=min_y,\n            max_y=max_y,\n            pixel_width=pixel_width,\n            pixel_height=pixel_height,\n            max_cells=max_cells,\n        )\n'''
          if target not in text:
              raise SystemExit('aggregate view target not found')
          text = text.replace(target, replacement, 1)
          target = '''        for level in self.manifest.levels:\n            count = _array(self._legacy_lod(), f"levels/{level.level}/count")\n'''
          replacement = '''        if self._sparse_lod is not None:\n            problems.extend(self._sparse_lod.check())\n            return problems\n\n        for level in self.manifest.levels:\n            count = _array(self._legacy_lod(), f"levels/{level.level}/count")\n'''
          if target not in text:
              raise SystemExit('check target not found')
          text = text.replace(target, replacement, 1)
          path.write_text(text)
          PY
      - name: Write dataset through GitHub REST API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          path = 'src/massive_scatter/dataset.py'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          def request(method, url, payload=None):
              req = Request(
                  url,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers=headers,
                  method=method,
              )
              with urlopen(req) as response:
                  return json.load(response)
          current = request(
              'GET',
              f'https://api.github.com/repos/{repo}/contents/{quote(path)}?ref={quote(branch)}',
          )
          request(
              'PUT',
              f'https://api.github.com/repos/{repo}/contents/{quote(path)}',
              {
                  'message': 'Dispatch schema v3 to sparse LOD reader [skip patch]',
                  'content': base64.b64encode(Path(path).read_bytes()).decode(),
                  'sha': current['sha'],
                  'branch': branch,
              },
          )
          PY
