name: Format sparse reader

on:
  push:
    branches:
      - feature/sparse-lod-20260830

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format sparse reader [skip format]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - run: uv run black src/massive_scatter/sparse_dataset.py
      - name: Write formatted reader through GitHub REST API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          path = 'src/massive_scatter/sparse_dataset.py'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          repo, branch = os.environ['REPO'], os.environ['BRANCH']
          def request(method, url, payload=None):
              req = Request(url, data=None if payload is None else json.dumps(payload).encode(), headers=headers, method=method)
              with urlopen(req) as response:
                  return json.load(response)
          current = request('GET', f'https://api.github.com/repos/{repo}/contents/{quote(path)}?ref={quote(branch)}')
          request('PUT', f'https://api.github.com/repos/{repo}/contents/{quote(path)}', {
              'message': 'Format sparse reader [skip format]',
              'content': base64.b64encode(Path(path).read_bytes()).decode(),
              'sha': current['sha'],
              'branch': branch,
          })
          PY
