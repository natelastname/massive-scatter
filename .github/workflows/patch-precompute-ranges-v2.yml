name: Patch precomputed viewport ranges v2

on:
  push:
    branches:
      - fix/precompute-viewport-ranges-20260901

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add viewport range patch v2 workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - name: Apply patch
        run: python .github/patch_precompute_ranges_v2.py
      - name: Validate viewer
        working-directory: viewer
        run: |
          npm ci
          npm test
          npm run build
      - name: Benchmark old vs precomputed range path
        working-directory: viewer
        run: |
          node - <<'JS'
          const n = 5000;
          const data = Array.from({length: n}, (_, i) => ({legacyValue: (i * 37) % 1009}));
          function finiteRangeBy(values, valueOf) {
            let lo = Infinity, hi = -Infinity;
            for (const item of values) {
              const v = valueOf(item);
              if (!Number.isFinite(v)) continue;
              lo = Math.min(lo, v); hi = Math.max(hi, v);
            }
            return [lo, hi];
          }
          function colorMath(value, range) {
            const d = range[1] - range[0] || 1;
            return Math.max(0, Math.min(1, (value - range[0]) / d));
          }
          let start = performance.now();
          let sink = 0;
          for (const datum of data) {
            const range = finiteRangeBy(data, item => item.legacyValue);
            sink += colorMath(datum.legacyValue, range);
          }
          const oldMs = performance.now() - start;
          start = performance.now();
          const range = finiteRangeBy(data, item => item.legacyValue);
          for (const datum of data) sink += colorMath(datum.legacyValue, range);
          const newMs = performance.now() - start;
          console.log(`old=${oldMs.toFixed(2)}ms new=${newMs.toFixed(2)}ms speedup=${(oldMs/newMs).toFixed(1)}x sink=${sink.toFixed(2)}`);
          JS
      - name: Publish production changes through GitHub REST API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          def request(method, url, payload=None):
              req = Request(url, data=None if payload is None else json.dumps(payload).encode(), headers=headers, method=method)
              with urlopen(req) as response:
                  return json.load(response)
          def put(path, message):
              url = f'https://api.github.com/repos/{repo}/contents/{quote(path)}'
              try:
                  current = request('GET', f'{url}?ref={quote(branch)}')
                  sha = current['sha']
              except Exception:
                  sha = None
              payload = {
                  'message': message,
                  'content': base64.b64encode(Path(path).read_bytes()).decode(),
                  'branch': branch,
              }
              if sha is not None:
                  payload['sha'] = sha
              request('PUT', url, payload)
          put('viewer/src/main.ts', 'Precompute viewport color and alpha ranges')
          put('viewer/src/range.ts', 'Add single-pass numeric range helper')
          put('viewer/test/range.test.ts', 'Test linear viewport range scan')
          PY
