name: Benchmark query latency

on:
  push:
    branches:
      - fix/sparse-query-latency-20260831

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --all-groups
      - name: Benchmark sparse aggregate queries
        run: |
          uv run python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from time import perf_counter
          import statistics

          import numpy as np
          import pyarrow as pa

          from massive_scatter import BuildConfig, MassiveScatterDataset, build_dataset

          n = 2_000_000
          x = np.arange(n, dtype=np.int64)
          # Adversarial EW-like geometry: thousands of interleaved rays. Nearby
          # x values usually land in distinct LOD cells and y-sorted Parquet
          # blocks cover broad x ranges.
          ray = ((x * 1_103_515_245 + 12_345) & 4095).astype(np.int64)
          slope_milli = 800 + 2 * ray
          y = (x * slope_milli) // 1000
          batches = [pa.record_batch([x, y], names=['x', 'y'])]

          def request(ds, xmin, xmax, ymin, ymax):
              start = perf_counter()
              response = ds.view(
                  min_x=xmin,
                  max_x=xmax,
                  min_y=ymin,
                  max_y=ymax,
                  pixel_width=1200,
                  pixel_height=800,
                  max_points=10_000,
                  max_cells=200_000,
              )
              return (perf_counter() - start) * 1000, response

          with TemporaryDirectory() as raw:
              output = Path(raw) / 'bench.msplot'
              t0 = perf_counter()
              manifest = build_dataset(
                  output,
                  batches,
                  config=BuildConfig(base_cell_size=64, part_rows=1_000_000),
              )
              print(f'BUILD {perf_counter()-t0:.3f}s LOD0={manifest.levels[0].occupied_cells}')
              ds = MassiveScatterDataset(output)
              rng = np.random.default_rng(20260831)
              windows = []
              for _ in range(80):
                  width = int(rng.integers(80_000, 500_000))
                  xmin = int(rng.integers(0, n - width))
                  xmax = xmin + width
                  ymin = max(0, int(xmin * 0.7))
                  ymax = min(int(y.max()), int(xmax * 3.0))
                  windows.append((xmin, xmax, ymin, ymax))

              # Warm index metadata so this measures viewport data work rather
              # than one-time index-file opens.
              request(ds, *windows[0])

              timings = []
              for i, window in enumerate(windows):
                  elapsed, response = request(ds, *window)
                  timings.append(elapsed)
                  if i < 5:
                      print(
                          'SAMPLE', i, f'{elapsed:.2f}ms', response['mode'],
                          response.get('level'), response.get('cell_count')
                      )
              ordered = sorted(timings)
              print(
                  f'SERIAL median={statistics.median(timings):.2f}ms '
                  f'p90={ordered[int(.9*len(ordered))-1]:.2f}ms '
                  f'p99={ordered[int(.99*len(ordered))-1]:.2f}ms '
                  f'max={max(timings):.2f}ms'
              )

              # Simulate a user generating stale viewport requests faster than
              # the server finishes them. Browser-side AbortController does not
              # cancel synchronous Arrow work already running server-side.
              burst = windows[:24]
              start = perf_counter()
              with ThreadPoolExecutor(max_workers=8) as pool:
                  results = list(pool.map(lambda w: request(ds, *w), burst))
              wall = (perf_counter() - start) * 1000
              concurrent = [item[0] for item in results]
              ordered = sorted(concurrent)
              print(
                  f'CONCURRENT wall={wall:.2f}ms median={statistics.median(concurrent):.2f}ms '
                  f'p90={ordered[int(.9*len(ordered))-1]:.2f}ms '
                  f'max={max(concurrent):.2f}ms'
              )
          PY
