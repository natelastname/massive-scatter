name: Finalize frontier docs

on:
  push:
    branches:
      - feature/adaptive-frontier-rendering-20260902

permissions:
  contents: write

jobs:
  docs:
    if: github.event.head_commit.message == 'Run frontier doc patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README
        run: python .github/finalize_frontier_docs.py
      - name: Publish README through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repo = os.environ['REPO']
          branch = os.environ['BRANCH']
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          def request(method, url, payload=None):
              req = Request(
                  url,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers=headers,
                  method=method,
              )
              with urlopen(req) as response:
                  return json.load(response)

          url = f'https://api.github.com/repos/{repo}/contents/README.md'
          current = request('GET', f'{url}?ref={quote(branch)}')
          request('PUT', url, {
              'message': 'Document adaptive frontier GPU handoff',
              'content': base64.b64encode(Path('README.md').read_bytes()).decode(),
              'sha': current['sha'],
              'branch': branch,
          })
          PY
