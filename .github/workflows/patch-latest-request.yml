name: Patch latest viewport requests

on:
  push:
    branches:
      - fix/sparse-query-latency-20260831

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use single-flight viewport requests [skip patch]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch and write viewer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: python .github/patch_latest_request.py
