[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "massive-scatter"
version = "0.1.0"
description = "Precision-preserving, out-of-core scatter plots with sparse numerical LODs"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [
  { name = "Nathan Nichols", email = "communications@resultsmotivated.com" },
]
dependencies = [
  "cyclopts>=4.23.3,<5",
  "fastapi>=0.116,<1",
  "numpy>=2,<3",
  "pyarrow>=21,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
massive-scatter = "massive_scatter.cli:cli"

[dependency-groups]
dev = [
  "basedpyright>=1.31.5,<2",
  "black>=24.4.2,<27",
  "httpx2>=2.12,<3",
  "pytest>=8,<10",
  "ruff>=0.13.2,<1",
]

[tool.isort]
profile = "black"
src_paths = ["src", "tests"]

[tool.pytest.ini_options]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning",
  "ignore:.*unclosed.*:ResourceWarning",
]

[tool.pyright]
typeCheckingMode = "standard"
reportMissingTypeStubs = "none"

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
