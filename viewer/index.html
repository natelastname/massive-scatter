<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>massive-scatter</title>
  </head>
  <body>
    <main id="app">
      <div id="plot"></div>
      <svg id="axes" aria-hidden="true"></svg>
      <header class="panel title-panel">
        <strong id="figure-title">massive-scatter</strong>
        <span id="dataset-summary">loading manifest…</span>
      </header>
      <section class="panel controls-panel">
        <button id="home" type="button" title="Fit the full dataset">Home</button>
        <label>
          primitive budget
          <input id="max-primitives" type="number" min="1000" max="1000000" step="1000" value="200000" />
        </label>
      </section>
      <aside id="legend" class="panel legend-panel" hidden></aside>
      <footer class="panel status-panel" id="status">loading…</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
